<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0a0a12" />
  <title>VITINHO MODZ — Gerador de Key</title>
  <link rel="icon" href="logo.png" />
  <style>
    :root {
      --bg0: #06060c;
      --bg1: #0e0e18;
      --card: rgba(14, 14, 24, 0.92);
      --red: #ff2d55;
      --red2: #c4183a;
      --blue: #3d8bfd;
      --cyan: #5ce1ff;
      --purple: #a855f7;
      --gold: #ffd666;
      --text: #f4f4f8;
      --muted: #9a9aab;
      --line: rgba(255,255,255,0.08);
      --ok: #3dff9a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(61,139,253,0.18), transparent 50%),
        radial-gradient(ellipse 70% 45% at 90% 100%, rgba(255,45,85,0.16), transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(168,85,247,0.08), transparent 55%),
        var(--bg0);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 22px 26px;
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 0 1px rgba(255,45,85,0.06),
        0 25px 80px rgba(0,0,0,0.55),
        0 0 60px rgba(61,139,253,0.06);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(61,139,253,0.45), transparent 40%, rgba(255,45,85,0.4));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }
    .logo-ring {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--blue), var(--red));
      box-shadow: 0 0 32px rgba(255,45,85,0.25), 0 0 32px rgba(61,139,253,0.2);
    }
    .logo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #0a0a12;
    }
    h1 {
      text-align: center;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, var(--red), #ff6b8a, var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 4px;
    }
    .badge {
      display: block;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--cyan);
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .key-box {
      width: 100%;
      padding: 16px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #0a0a14, #080810);
      color: var(--gold);
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 10px;
      word-break: break-all;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status {
      text-align: center;
      font-size: 0.82rem;
      color: var(--ok);
      min-height: 1.3em;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .status.err { color: #ff7a8a; }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      color: #fff;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.97); }
    .btn-gen {
      background: linear-gradient(135deg, var(--purple), #6d28d9);
      box-shadow: 0 8px 24px rgba(168,85,247,0.28);
    }
    .btn-copy {
      background: linear-gradient(135deg, var(--blue), #1d4ed8);
      box-shadow: 0 8px 24px rgba(61,139,253,0.28);
    }
    .btn-multi {
      width: 100%;
      background: linear-gradient(135deg, var(--red), var(--red2));
      box-shadow: 0 8px 24px rgba(255,45,85,0.28);
      margin-bottom: 8px;
    }
    .list {
      display: none;
      margin: 8px 0 4px;
      max-height: 150px;
      overflow: auto;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #d0d0dc;
      background: #080810;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      white-space: pre-wrap;
    }
    .list.show { display: block; }
    .steps {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 0.78rem;
      line-height: 1.55;
      color: var(--muted);
    }
    .steps strong { color: #ddd; }
    .steps ol { margin: 8px 0 0 18px; }
    .steps li { margin-bottom: 4px; }
    footer {
      text-align: center;
      margin-top: 14px;
      font-size: 0.7rem;
      color: #5a5a6a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo-wrap">
        <div class="logo-ring">
          <img src="logo.png" alt="VITINHO MODZ" width="126" height="126" />
        </div>
      </div>
      <h1>VITINHO MODZ</h1>
      <span class="badge">Key Generator Online</span>

      <label>Key gerada</label>
      <div class="key-box" id="keyOut">— toque em GERAR KEY —</div>
      <div class="status" id="msg"></div>

      <div class="row">
        <button type="button" class="btn-gen" onclick="gerarUma()">GERAR KEY</button>
        <button type="button" class="btn-copy" onclick="copiar()">COPIAR</button>
      </div>
      <button type="button" class="btn-multi" onclick="gerarVarias(5)">GERAR 5 KEYS</button>
      <div class="list" id="lista"></div>

      <div class="steps">
        <strong>Como ativar no mod</strong>
        <ol>
          <li>Gere e copie a key</li>
          <li>No jogo: <strong>COLAR</strong> → <strong>ATIVAR KEY</strong></li>
          <li>Não precisa de keys.txt — libera na hora</li>
        </ol>
      </div>
    </div>
    <footer>VITINHO MODZ · Gerador oficial</footer>
  </div>

  <script>
    const HEX = "0123456789ABCDEF";
    // MESMO segredo do KeyLogin.h — key funciona sem keys.txt
    const KEY_SECRET = "VITINHO_MODZ_K7x9_Q2";
    let atual = "";
    function rnd() {
      const a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0];
    }
    function checksum4(body) {
      let h = 2166136261 >>> 0;
      const data = body + KEY_SECRET;
      for (let i = 0; i < data.length; i++) {
        h ^= data.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      let out = "";
      for (let i = 0; i < 4; i++) {
        out += HEX[h & 0xF];
        h >>>= 4;
      }
      return out;
    }
    function makeKey() {
      let body = "";
      for (let i = 0; i < 4; i++) body += HEX[rnd() % 16];
      return "VITINHO-" + body + "-" + checksum4(body);
    }
    function setMsg(t, err) {
      const el = document.getElementById("msg");
      el.textContent = t;
      el.className = "status" + (err ? " err" : "");
    }
    function gerarUma() {
      atual = makeKey();
      document.getElementById("keyOut").textContent = atual;
      document.getElementById("lista").classList.remove("show");
      setMsg("Key gerada com sucesso");
    }
    function copiar() {
      if (!atual) { setMsg("Gere uma key primeiro", true); return; }
      navigator.clipboard.writeText(atual).then(function () {
        setMsg("Copiada para a área de transferência");
      }).catch(function () {
        setMsg("Selecione a key e copie manualmente", true);
      });
    }
    function gerarVarias(n) {
      var arr = [];
      for (var i = 0; i < n; i++) arr.push(makeKey());
      atual = arr[0];
      document.getElementById("keyOut").textContent = atual;
      var el = document.getElementById("lista");
      el.textContent = arr.join("\n");
      el.classList.add("show");
      setMsg(n + " keys geradas — primeira no campo");
      navigator.clipboard.writeText(arr.join("\n")).catch(function () {});
    }
  </script>
</body>
</html>
